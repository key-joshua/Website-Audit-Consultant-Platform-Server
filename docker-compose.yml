services:
  database:
    image: postgres:16
    container_name: DATABASE
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DOCKER_DATABASE_USER}
      POSTGRES_PASSWORD: ${DOCKER_DATABASE_PASSWORD}
      POSTGRES_DB: ${DOCKER_DATABASE_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCKER_DATABASE_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
  server_replicate_1:
    build:
      context: .
      dockerfile: Dockerfile.server

    container_name: server_replicate_1
    env_file:
      - .env
    environment:
      SERVER_ID: server_replicate_1
      DEVELOPMENT_DB_POSTGRESQL_HOST: database
    depends_on:
      database:
        condition: service_healthy
    restart: always
    ports:
      - "3001:3000"

  server_replicate_2:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: server_replicate_2
    env_file:
      - .env
    environment:
      SERVER_ID: server_replicate_2
      DEVELOPMENT_DB_POSTGRESQL_HOST: database
    depends_on:
      database:
        condition: service_healthy
    restart: always
    ports:
      - "3002:3000"

  server_replicate_3:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: server_replicate_3
    env_file:
      - .env
    environment:
      SERVER_ID: server_replicate_3
      DEVELOPMENT_DB_POSTGRESQL_HOST: database
    depends_on:
      database:
        condition: service_healthy
    restart: always
    ports:
      - "3003:3000"

  nginx:
    image: nginx:latest
    container_name: NGINX
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - server_replicate_1
      - server_replicate_2
      - server_replicate_3

volumes:
  postgres: