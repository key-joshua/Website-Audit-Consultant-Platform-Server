version: '3.8'

services:
  SERVER_REPLICATE_1:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: SERVER_REPLICATE_1
    env_file:
      - .env
    depends_on:
      - database
    environment:
      SERVER_ID: SERVER_REPLICATE-1
    ports:
      - "3001:3000"
    restart: always

  SERVER_REPLICATE_2:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: SERVER_REPLICATE_2
    env_file:
      - .env
    depends_on:
      - database
    environment:
      SERVER_ID: SERVER_REPLICATE-2
    ports:
      - "3002:3000"
    restart: always

  SERVER_REPLICATE_3:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: SERVER_REPLICATE_3
    env_file:
      - .env
    depends_on:
      - database
    environment:
      SERVER_ID: SERVER_REPLICATE-3
    ports:
      - "3003:3000"
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - SERVER_REPLICATE_1
      - SERVER_REPLICATE_2
      - SERVER_REPLICATE_3

  database:
    build:
      context: .
      dockerfile: Dockerfile.database
    ports:
      - "5432:5432"
    environment:
      DATABASE_USER: ${DOCKER_DATABASE_USER}
      DATABASE_NAME: ${DOCKER_DATABASE_NAME}
      DATABASE_PASSWORD: ${DOCKER_DATABASE_PASSWORD}
      POSTGRES_USER: ${DOCKER_DATABASE_USER}
      POSTGRES_NAME: ${DOCKER_DATABASE_NAME}
      POSTGRES_PASSWORD: ${DOCKER_DATABASE_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: ${DOCKER_DATABASE_HOST_AUTH_METHOD}
    restart: unless-stopped
    volumes:
      - postgres:/var/lib/postgresql/data/pgdata
